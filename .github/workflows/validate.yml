name: RMF Compliance Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - name: Build and validate sample authorization artifacts
        run: openrmf build examples/ai-document-assistant/system.yaml --poam examples/ai-document-assistant/poam.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: rmf-artifacts
          path: build/

